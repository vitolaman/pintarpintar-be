name: pintar-pintar-local

services:
  postgres:
    image: ${LOCAL_POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_DB: ${LOCAL_DB_DATABASE:-pintar_pintar}
      POSTGRES_USER: ${LOCAL_DB_USERNAME:-pintar_pintar}
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:-pintar_pintar_local}
    ports:
      - '${LOCAL_DB_PORT:-5433}:5432'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${LOCAL_DB_USERNAME:-pintar_pintar} -d ${LOCAL_DB_DATABASE:-pintar_pintar}',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    volumes:
      - pintar-pintar-postgres:/var/lib/postgresql/data

  redis:
    image: ${LOCAL_REDIS_IMAGE:-redis:7-alpine}
    ports:
      - '${LOCAL_REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  jaeger:
    image: ${LOCAL_JAEGER_IMAGE:-jaegertracing/all-in-one:1.59.0}
    ports:
      - '${LOCAL_JAEGER_UI_PORT:-16686}:16686'
      - '${LOCAL_JAEGER_OTLP_GRPC_PORT:-4317}:4317'
      - '${LOCAL_JAEGER_OTLP_HTTP_PORT:-4318}:4318'

volumes:
  pintar-pintar-postgres:
